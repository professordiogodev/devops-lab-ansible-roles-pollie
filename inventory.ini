# Provided. The same three servers as last lab, new names (pr- = "Pollie roles").
[web]
pr-web ansible_host=127.0.0.1 ansible_port=2231

[app]
pr-app ansible_host=127.0.0.1 ansible_port=2232

[db]
pr-db ansible_host=127.0.0.1 ansible_port=2233

[servers:children]
web
app
db

[servers:vars]
ansible_user=deploy
ansible_ssh_private_key_file=keys/id_ed25519
ansible_ssh_common_args=-o IdentitiesOnly=yes
